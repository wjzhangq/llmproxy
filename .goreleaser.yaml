version: 2

project_name: llmproxy

before:
  hooks:
    - go mod tidy

builds:
  - id: llmproxy
    main: ./cmd/llmproxy
    binary: llmproxy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/wjzhangq/llmproxy/internal/version.Version={{ .Version }}
      - -X github.com/wjzhangq/llmproxy/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/wjzhangq/llmproxy/internal/version.BuildTime={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - config.example.yaml
      - internal/report/prompts/default.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
