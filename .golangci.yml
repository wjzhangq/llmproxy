version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*bufio.Writer).Write
        - (*bufio.Writer).WriteByte
        - (*bufio.Writer).Flush
        - (*compress/gzip.Reader).Close
        - (*net/http.Server).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]
